<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7b5cff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf8ff;
  --panel: #ffffff;
  --panel-2: #f4effc;
  --text: #24203a;
  --muted: #8a84a0;
  --line: #ebe4f5;
  --accent: #7b5cff;
  --accent-soft: #efeaff;
  --done: #2f9e6b;
  --done-soft: #e3f4ec;
  --warn: #c9821a;
  --warn-soft: #fbf0dc;
  --danger: #d64545;
  --shadow: 0 1px 2px rgba(80,40,120,.05), 0 8px 24px rgba(80,40,120,.07);
  --glow-a: rgba(255,120,170,.22);
  --glow-b: rgba(90,160,255,.20);
  --glow-c: rgba(255,200,80,.20);
  --rainbow: linear-gradient(90deg, #ff5e8a, #ff9f43, #f7c548, #2ecc8f, #4d9bff, #a66bff);
  color-scheme: light dark;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121d; --panel: #1e1b2a; --panel-2: #2a2639; --text: #efedf5; --muted: #9590a8;
    --line: #34304a; --accent: #8b7bff; --accent-soft: #2c2650; --done: #4cc38a; --done-soft: #1d3329;
    --warn: #ffb347; --warn-soft: #3d2f1a; --danger: #ff7a7a; --shadow: none;
    --glow-a: rgba(255,94,138,.14); --glow-b: rgba(77,155,255,.14); --glow-c: rgba(166,107,255,.14);
  }
}
:root[data-theme="dark"] {
  --bg: #14121d; --panel: #1e1b2a; --panel-2: #2a2639; --text: #efedf5; --muted: #9590a8;
  --line: #34304a; --accent: #8b7bff; --accent-soft: #2c2650; --done: #4cc38a; --done-soft: #1d3329;
  --warn: #ffb347; --warn-soft: #3d2f1a; --danger: #ff7a7a; --shadow: none;
  --glow-a: rgba(255,94,138,.14); --glow-b: rgba(77,155,255,.14); --glow-c: rgba(166,107,255,.14);
}

* { box-sizing: border-box; }
body {
  margin: 0; color: var(--text); min-height: 100vh;
  background:
    radial-gradient(600px 400px at 0% 0%, var(--glow-a), transparent 70%),
    radial-gradient(700px 500px at 100% 10%, var(--glow-b), transparent 70%),
    radial-gradient(600px 500px at 50% 100%, var(--glow-c), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  font-family: "Noto Sans TC", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
  font-size: 15px; line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }

.app { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
header.top {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
header.top h1 {
  font-size: 24px; margin: 0; font-weight: 700; letter-spacing: .02em;
}
header.top .spacer { flex: 1; }
.search {
  position: relative; width: 260px; max-width: 100%;
}
.search input {
  width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); outline: none;
}
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
  padding: 7px 12px; font-size: 14px;
}
.btn:hover { background: var(--panel-2); }
.btn.primary { background: linear-gradient(135deg, #ff5e8a, #a66bff); border: none; color: #fff; font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.icon-btn {
  border: none; background: transparent; border-radius: 8px; width: 32px; height: 32px;
  display: inline-grid; place-items: center; color: var(--muted);
}
.icon-btn:hover { background: var(--panel-2); color: var(--text); }

.layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

/* calendar */
.cal { padding: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head .title { font-weight: 700; font-size: 16px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.cal-day {
  position: relative; aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid transparent;
  background: transparent; padding: 4px; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: 2px; font-size: 14px;
}
.cal-day:hover { background: var(--panel-2); }
.cal-day.has { background: color-mix(in srgb, var(--wd) 13%, transparent); }
.cal-day.has:hover { background: color-mix(in srgb, var(--wd) 22%, transparent); }
.cal-day.out { color: var(--muted); opacity: .45; }
.cal-day.weekend .num { color: var(--muted); }
.cal-day.today .num { background: linear-gradient(135deg, #ff5e8a, #a66bff); color: #fff; border-radius: 999px; font-weight: 700; }
.cal-day.selected { border-color: var(--wd); border-width: 2px; }
.cal-day .num { min-width: 24px; height: 24px; line-height: 24px; text-align: center; padding: 0 4px; }
.cal-day .meta { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
.cal-day .meta.all-done { color: var(--done); font-weight: 700; }
.cal-day .meta.pending { color: var(--warn); }
.cal-day .tag {
  position: absolute; bottom: 3px; left: 3px; right: 3px; font-size: 10px; line-height: 1.3;
  background: var(--warn-soft); color: var(--warn); border-radius: 4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; padding: 0 3px;
}

.side { display: flex; flex-direction: column; gap: 20px; }
.section { padding: 16px; }
.section h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.section h3::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--dot, var(--accent)); }
#searchSection h3 { --dot: #4d9bff; }
#backlogSection h3 { --dot: #ff9f43; }
.section h3 .count { background: linear-gradient(135deg, #ff9f43, #ff5e8a); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; }
.mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow: auto; }
.mini-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 14px;
}
.mini-item:hover { background: var(--panel-2); }
.mini-item .d { font-size: 12px; color: var(--muted); flex: none; width: 66px; white-space: nowrap; cursor: pointer; }
.mini-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.mini-item .t.done { text-decoration: line-through; color: var(--muted); }
.mini-item mark { background: var(--warn-soft); color: inherit; border-radius: 3px; }
.link-btn { border: none; background: none; color: var(--accent); font-size: 12px; padding: 2px 4px; flex: none; }
.link-btn:hover { text-decoration: underline; }
.empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

/* day panel */
.day { padding: 24px; min-height: 480px; position: relative; overflow: hidden; }
.day::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--wd, var(--accent)); }
.day-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-head .date { font-size: 28px; font-weight: 700; letter-spacing: .01em; color: var(--wd, var(--text)); }
.day-head .sub { color: var(--muted); font-size: 14px; }
.day-head .spacer { flex: 1; }
.note {
  margin-top: 10px; width: 100%; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px;
  background: transparent; outline: none; font-size: 14px;
}
.note:focus { border-style: solid; border-color: var(--accent); }
.note.has { border-style: solid; background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 500; }

.progress { margin: 18px 0 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.bar { height: 8px; }
.bar > i { display: block; height: 100%; background: var(--rainbow); background-size: 300px 100%; border-radius: 999px; transition: width .25s; }

.add { display: flex; gap: 8px; margin: 12px 0 8px; }
.add input {
  flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); outline: none;
}
.add input:focus { border-color: var(--accent); background: var(--panel); }
.hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }

.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.task {
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 6px; border-radius: 10px;
  border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 7%, transparent); margin-bottom: 4px;
}
.task:hover { background: color-mix(in srgb, var(--c) 15%, transparent); }
.task.done { border-left-color: color-mix(in srgb, var(--c) 35%, transparent); background: transparent; }
.task.dragging { opacity: .4; }
.task.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
.grip { color: var(--muted); cursor: grab; opacity: 0; width: 14px; flex: none; display: grid; place-items: center; }
.task:hover .grip { opacity: .7; }
.check {
  width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--c); flex: none;
  display: grid; place-items: center; background: transparent; padding: 0;
}
.check svg { opacity: 0; color: #fff; }
.task.done .check, .ev.done .check { background: var(--c); border-color: var(--c); }
.task.done .check svg, .ev.done .check svg { opacity: 1; }

/* important items (submissions / meetings), kept apart from tasks */
.events {
  margin-top: 16px; padding: 14px; border-radius: 14px;
  background: color-mix(in srgb, #ff5e8a 6%, var(--panel));
  border: 1px solid color-mix(in srgb, #ff5e8a 22%, var(--line));
}
.ev-head { font-weight: 700; font-size: 14px; margin-bottom: 10px; }
.ev-list { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ev {
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c);
}
.ev .chip {
  font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 700; flex: none; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c);
}
.ev .text { flex: 1; min-width: 0; word-break: break-word; }
.ev .meta { font-size: 13px; font-weight: 700; color: var(--c); flex: none; }
.ev.done .text, .ev.done .meta { text-decoration: line-through; color: var(--muted); }
.ev .del { opacity: 0; }
.ev:hover .del, .ev:focus-within .del { opacity: 1; }
@media (hover: none) { .ev .del { opacity: 1; } }
.ev-empty { font-size: 13px; color: var(--muted); margin: -2px 0 10px; }
.ev-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 10px; }
.seg button { border: none; background: none; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--c); font-weight: 700; box-shadow: var(--shadow); }
.ev-add input {
  padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); outline: none; min-width: 0;
}
.ev-add input:focus { border-color: var(--accent); }
#evText { flex: 1 1 160px; }
#evTime { width: 120px; }
.cal-day .ev-mark { font-size: 10px; line-height: 1; letter-spacing: -1px; }
.cal-day .ev-mark.dim { opacity: .35; }
.mini-item .d.overdue { color: var(--danger); font-weight: 700; }
#upcomingSection h3 { --dot: #ff5e8a; }

/* ---------- FSD kanban board ---------- */
.board-wrap { margin-top: 24px; }
.board-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.board-head h2 { margin: 0; font-size: 20px; }
.board-head .sub { color: var(--muted); font-size: 13px; }
.board-head .spacer { flex: 1; }
.board-head label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col {
  flex: 0 0 272px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px; display: flex; flex-direction: column; max-height: 78vh;
}
.col-head { display: flex; align-items: center; gap: 4px; padding: 2px 2px 8px 4px; font-weight: 700; font-size: 14px; }
.col-head .name { flex: 1; min-width: 0; word-break: break-word; cursor: text; }
.col-head .n { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--panel-2); border-radius: 999px; padding: 0 8px; }
.col-head .icon-btn { width: 24px; height: 24px; font-size: 13px; opacity: 0; }
.col:hover .col-head .icon-btn { opacity: 1; }
@media (hover: none) { .col-head .icon-btn { opacity: 1; } }
.col-head input { flex: 1; min-width: 0; font-weight: 700; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; background: var(--panel); outline: none; }
.col-cards { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 12px; padding: 2px; border-radius: 10px; }
.col.drop-target .col-cards { background: var(--accent-soft); }
.drop-line { height: 4px; background: var(--accent); border-radius: 2px; flex: none; }
.kcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; overflow: hidden; flex: none;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
.kcard:hover { border-color: var(--accent); }
.kcard.dragging { opacity: .4; }
.kcard.archived { opacity: .5; }
.kcard .cover { height: 24px; }
.kcard .body { padding: 8px 10px; }
.kcard .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.kcard .title { font-size: 14px; word-break: break-word; }
.kcard .badges { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.kcard .badges:empty { display: none; }
.kcard .badges .done { color: var(--done); font-weight: 700; }
.lbl {
  font-size: 11px; font-weight: 700; color: #1d2125; border-radius: 4px; padding: 0 6px; min-width: 36px;
  height: 18px; line-height: 18px; border: none; display: inline-block; text-align: center;
}
.add-card { margin-top: 6px; border: none; background: none; color: var(--muted); text-align: left; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
.add-card:hover { background: var(--panel-2); color: var(--text); }
.new-card { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.new-card textarea, .new-col input {
  width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--accent); background: var(--panel);
  font: inherit; font-size: 14px; color: inherit; outline: none; resize: none;
}
.add-col { flex: 0 0 272px; border: 2px dashed var(--line); background: transparent; border-radius: 14px; padding: 12px; color: var(--muted); font-size: 14px; }
.add-col:hover { border-color: var(--accent); color: var(--text); }

/* card detail */
.modal {
  position: fixed; inset: 0; z-index: 15; background: rgba(10,8,20,.45); display: flex; justify-content: center;
  align-items: flex-start; overflow-y: auto; padding: 48px 16px;
}
.modal[hidden] { display: none; }
.mbox { position: relative; width: 100%; max-width: 720px; background: var(--panel); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.mbox > .cover { height: 64px; }
.m-close { position: absolute; top: 10px; right: 10px; background: color-mix(in srgb, var(--panel) 80%, transparent); }
.mbody { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
.m-title {
  font: inherit; font-size: 20px; font-weight: 700; color: inherit; width: calc(100% - 36px); padding: 4px 6px;
  border: 1px solid transparent; border-radius: 8px; background: transparent; outline: none;
}
.m-title:focus { border-color: var(--accent); background: var(--bg); }
.m-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
.m-row select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.arch-tag { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 1px 8px; font-weight: 700; }
.m-sec h4 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.m-sec h4 .muted { color: var(--muted); font-weight: 500; font-size: 13px; }
.lbl-pick, .cover-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.lbl-pick .lbl { cursor: pointer; height: 26px; line-height: 26px; min-width: 48px; font-size: 12px; }
.lbl-pick .lbl.off { opacity: .3; }
.sw { width: 32px; height: 22px; border-radius: 6px; border: 2px solid transparent; font-size: 11px; color: var(--muted); }
.sw.on { border-color: var(--text); }
.desc-view { font-size: 14px; line-height: 1.75; word-break: break-word; padding: 10px 12px; background: var(--bg); border-radius: 10px; cursor: text; min-height: 48px; }
.desc-view a, .comment a { color: var(--accent); }
.desc-view del, .comment del { color: var(--muted); }
.placeholder { color: var(--muted); }
.m-ta {
  width: 100%; min-height: 180px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--bg); font: inherit; font-size: 14px; color: inherit; outline: none; resize: vertical;
}
.m-ta.small { min-height: 64px; border-color: var(--line); }
.m-ta.small:focus { border-color: var(--accent); }
.chk-bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
.chk-bar i { display: block; height: 100%; background: var(--done); }
.chk-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
.chk-item span { flex: 1; }
.chk-item.done span { text-decoration: line-through; color: var(--muted); }
.chk-item .icon-btn { width: 24px; height: 24px; opacity: 0; }
.chk-item:hover .icon-btn { opacity: 1; }
.m-add { display: flex; gap: 8px; margin-top: 6px; align-items: flex-start; }
.m-add input { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; }
.m-add input:focus { border-color: var(--accent); }
.comments { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.comment { background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.comment .when { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.m-foot { justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 14px; }
.btn.danger { color: var(--danger); }

/* cloud sync */
.sync {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px 5px 10px;
  font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--sync-c, var(--muted)); }
.sync[data-s="ok"] { --sync-c: #2ecc8f; }
.sync[data-s="syncing"] { --sync-c: #4d9bff; }
.sync[data-s="syncing"]::before { animation: twinkle .8s ease-in-out infinite; }
.sync[data-s="error"] { --sync-c: #ff5e5e; color: var(--danger); }
.sync[data-s="login"] { --sync-c: #ff9f43; }
.sync[data-s="offline"] { --sync-c: #9590a8; }
.auth {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(6px);
}
.auth[hidden] { display: none; }
.auth-box { width: 100%; max-width: 360px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; }
.auth-box h2 { margin: 0; font-size: 20px; }
.auth-box p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
.auth-box input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); outline: none; }
.auth-box input:focus { border-color: var(--accent); }

.task .text { flex: 1; min-width: 0; word-break: break-word; cursor: text; }
.task.done .text { text-decoration: line-through; color: var(--muted); }
.task .from { font-size: 11px; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 5px; flex: none; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;

}

.toast button { border: none; background: none; color: var(--accent); font-weight: 700; padding: 0; }

.menu-wrap { position: relative; }

}

@media (prefers-color-scheme: dark) {

@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

<script>
// ---------- cloud sync settings ----------
// Fill in from Supabase → Project Settings → API to sync across devices.
// Leave empty to keep data only in this browser.
const SUPABASE_URL = 'https://sihqlomgsolmrhrmazny.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JolHbMrnTKZMF1Qvohw4kw_qZcMD9r9';

const KEY = 'worklog.v1';
const DOW = ['日', '一', '二', '三', '四', '五', '六'];
// one color per weekday (日..六), and a cycling palette for task rows
const WD_COLORS = ['#ff5e8a', '#ff6b6b', '#ff9f43', '#e8b100', '#2ecc8f', '#4d9bff', '#a66bff'];
const TASK_COLORS = ['#ff5e8a', '#ff9f43', '#e8b100', '#2ecc8f', '#22c1c3', '#4d9bff', '#a66bff'];
const $ = id => document.getElementById(id);

// ---------- storage ----------
function normalize(s) {
  if (!s || !s.days) s = { days: {} };
  if (!s.board) s.board = { lists: [], labels: [], cards: {} };
  return s;
}
function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) {}
  return normalize(null);
}
function writeLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function save() {
  writeLocal();
  scheduleSync();
}
let state = load();

// ---------- dates ----------
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const shortLabel = k => { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()} (${DOW[d.getDay()]})`; };
function nextWorkday(k) {
  let n = addDays(k, 1);
  while ([0, 6].includes(parseKey(n).getDay())) n = addDays(n, 1);
  return n;
}

let selected = todayKey();
let viewMonth = (() => { const d = parseKey(selected); return new Date(d.getFullYear(), d.getMonth(), 1); })();

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const getDay = k => state.days[k] || { note: '', tasks: [], events: [] };
function ensureDay(k) {
  if (!state.days[k]) state.days[k] = { note: '', tasks: [] };
  if (!state.days[k].events) state.days[k].events = [];
  return state.days[k];
}
function cleanup(k) {
  const d = state.days[k];
  if (d && !d.note && d.tasks.length === 0 && !(d.events && d.events.length)) delete state.days[k];
}

// important items: submissions, meetings, other
const EV = {
  submit:  { icon: '📄', label: '繳交', done: '已繳交', color: '#ff5e8a', ph: '例如：FSD 97405、97412' },
  meeting: { icon: '👥', label: '會議', done: '已開完', color: '#4d9bff', ph: '例如：週會、GBP BA Review' },
  other:   { icon: '⭐', label: '其他', done: '完成',   color: '#a66bff', ph: '例如：系統上線' },
};
const evOf = e => EV[e.type] || EV.other;
const byTime = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');
function commit() { save(); render(); }

// ---------- task ops ----------
function addTasks(k, lines) {
  const day = ensureDay(k);
  lines.map(s => s.trim()).filter(Boolean).forEach(text =>
    day.tasks.push({ id: uid(), text, done: false, createdAt: Date.now() }));
  commit();
}
function findTask(id) {
  for (const k in state.days) {
    const i = state.days[k].tasks.findIndex(t => t.id === id);
    if (i >= 0) return { k, i, t: state.days[k].tasks[i] };
  }
  return null;
}
function toggleTask(id) {
  const f = findTask(id); if (!f) return;
  f.t.done = !f.t.done;
  f.t.doneAt = f.t.done ? Date.now() : undefined;
  commit();
}
function moveTask(id, toKey) {
  const f = findTask(id); if (!f || f.k === toKey) return;
  state.days[f.k].tasks.splice(f.i, 1);
  cleanup(f.k);
  const t = f.t;
  if (!t.from) t.from = f.k;
  ensureDay(toKey).tasks.push(t);
  commit();
  showToast(`已移到 ${shortLabel(toKey)}`, () => {
    const g = findTask(id); if (!g) return;
    state.days[g.k].tasks.splice(g.i, 1); cleanup(g.k);
    ensureDay(f.k).tasks.splice(f.i, 0, t);
    if (t.from === f.k) delete t.from;
    commit();
  });
}
function deleteTask(id) {
  const f = findTask(id); if (!f) return;
  state.days[f.k].tasks.splice(f.i, 1);
  cleanup(f.k);
  commit();
  showToast('已刪除', () => { ensureDay(f.k).tasks.splice(f.i, 0, f.t); commit(); });
}

function findEvent(id) {
  for (const k in state.days) {
    const list = state.days[k].events || [];
    const i = list.findIndex(e => e.id === id);
    if (i >= 0) return { k, i, e: list[i] };
  }
  return null;
}
function toggleEvent(id) {
  const f = findEvent(id); if (!f) return;
  f.e.done = !f.e.done;
  commit();
}
function deleteEvent(id) {
  const f = findEvent(id); if (!f) return;
  state.days[f.k].events.splice(f.i, 1);
  cleanup(f.k);
  commit();
  showToast('已刪除', () => { ensureDay(f.k).events.splice(f.i, 0, f.e); commit(); });
}

// ---------- render ----------
function render() {
  renderCalendar();
  renderDay();
  renderUpcoming();
  renderBacklog();
  renderSearch();
  renderBoard();
  if (openId) renderModal();
}

function renderCalendar() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  $('monthTitle').textContent = `${y} 年 ${m + 1} 月`;
  const grid = $('calGrid');
  grid.innerHTML = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const today = todayKey();
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i === 35 && d.getMonth() !== m) break;
    const k = keyOf(d), day = getDay(k);
    const total = day.tasks.length, done = day.tasks.filter(t => t.done).length;
    const cls = ['cal-day'];
    if (d.getMonth() !== m) cls.push('out');
    if (d.getDay() === 0 || d.getDay() === 6) cls.push('weekend');
    if (k === today) cls.push('today');
    if (k === selected) cls.push('selected');
    const evs = day.events || [];
    if (total || day.note || evs.length) cls.push('has');
    let meta = '';
    if (total) {
      const c = done === total ? 'all-done' : (k < today ? 'pending' : '');
      meta = `<span class="meta ${c}">${done === total ? '✓ ' + total : done + '/' + total}</span>`;
    }
    const tag = day.note ? `<span class="tag">${esc(day.note)}</span>` : '';
    const mark = evs.length
      ? `<span class="ev-mark ${evs.every(e => e.done) ? 'dim' : ''}">${[...new Set(evs.map(e => evOf(e).icon))].join('')}</span>` : '';
    const b = document.createElement('button');
    b.className = cls.join(' ');
    b.style.setProperty('--wd', WD_COLORS[d.getDay()]);
    b.innerHTML = `<span class="num">${d.getDate()}</span>${meta}${mark}${tag}`;
    b.title = [shortLabel(k), day.note, ...evs.map(e => `${evOf(e).icon} ${e.text}`)].filter(Boolean).join('\n');
    b.onclick = () => select(k);
    grid.appendChild(b);
  }
}

function renderDay() {
  const d = parseKey(selected), day = getDay(selected), today = todayKey();
  $('dayTitle').textContent = shortLabel(selected);
  document.querySelector('main.day').style.setProperty('--wd', WD_COLORS[d.getDay()]);
  const diff = Math.round((d - parseKey(today)) / 86400000);
  const rel = diff === 0 ? '今天' : diff === -1 ? '昨天' : diff === 1 ? '明天' : diff < 0 ? `${-diff} 天前` : `${diff} 天後`;
  $('daySub').textContent = `${d.getFullYear()} · ${rel}`;

  const note = $('note');
  if (document.activeElement !== note) note.value = day.note || '';
  note.classList.toggle('has', !!day.note && document.activeElement !== note);

  const evList = $('eventList'), evs = [...(day.events || [])].sort(byTime);
  evList.innerHTML = '';
  evs.forEach(e => evList.appendChild(eventEl(e)));
  $('evEmpty').hidden = evs.length > 0;

  const total = day.tasks.length, done = day.tasks.filter(t => t.done).length;
  $('progress').hidden = total === 0;
  $('barFill').style.width = total ? (done / total * 100) + '%' : '0';
  $('progressText').textContent = `${done} / ${total} 完成`;

  const list = $('taskList');
  list.innerHTML = '';
  $('emptyDay').hidden = total > 0;
  day.tasks.forEach((t, i) => list.appendChild(taskEl(t, i)));
}

function taskEl(t, i) {
  const li = document.createElement('li');
  li.className = 'task' + (t.done ? ' done' : '');
  li.style.setProperty('--c', TASK_COLORS[i % TASK_COLORS.length]);

    <span class="grip" title="拖曳排序"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="7" r="1.4"/><circle cx="8" cy="7" r="1.4"/><circle cx="2" cy="12" r="1.4"/><circle cx="8" cy="12" r="1.4"/></svg></span>
    <button class="check" title="完成"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></button>
    <span class="text">${esc(t.text)}</span>
    ${t.from ? `<span class="from" title="從 ${shortLabel(t.from)} 延過來">延自 ${shortLabel(t.from).split(' ')[0]}</span>` : ''}
    <span class="actions">
      ${t.done ? '' : `<button class="icon-btn" data-a="defer" title="延到下個工作日"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`}
      <button class="icon-btn" data-a="edit" title="編輯"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>
      <button class="icon-btn" data-a="del" title="刪除"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    </span>`;

  li.addEventListener('dragend', () => li.classList.remove('dragging'));

function startEdit(li, t) {
  const span = li.querySelector('.text');
  const input = document.createElement('input');
  input.className = 'edit'; input.value = t.text;
  span.replaceWith(input);
  li.draggable = false;
  input.focus(); input.select();
  let finished = false;
  const finish = ok => {
    if (finished) return; finished = true;
    const v = input.value.trim();
    if (ok && v && v !== t.text) { t.text = v; save(); }
    render();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) finish(true);
    if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
}

function renderBacklog() {

function renderSearch() {
  const q = $('search').value.trim().toLowerCase();
  $('searchSection').hidden = !q;
  if (!q) return;
  const hits = [];
  Object.values(state.board.cards).forEach(c => {
    if ((c.title + '\n' + c.desc).toLowerCase().includes(q)) {
      const list = state.board.lists.find(l => l.id === c.listId);
      hits.push({ card: c.id, label: list ? list.name : '', text: '🗂 ' + c.title, done: c.archived });
    }
  });
  Object.keys(state.days).sort().reverse().forEach(k => {
    const day = state.days[k];
    if (day.note && day.note.toLowerCase().includes(q)) hits.push({ k, text: '📌 ' + day.note });
    (day.events || []).forEach(e => { if (e.text.toLowerCase().includes(q)) hits.push({ k, text: `${evOf(e).icon} ${e.text}`, done: e.done }); });
    day.tasks.forEach(t => { if (t.text.toLowerCase().includes(q)) hits.push({ k, text: t.text, done: t.done }); });
  });
  const ul = $('searchList');
  ul.innerHTML = hits.length ? '' : '<li class="empty">找不到符合的紀錄</li>';
  hits.forEach(h => {
    const li = document.createElement('li');
    li.className = 'mini-item';
    const d = h.card ? `<span class="d" title="${esc(h.label)}" style="overflow:hidden;text-overflow:ellipsis">${esc(h.label)}</span>` : `<span class="d">${shortLabel(h.k)}</span>`;
    li.innerHTML = `${d}<span class="t ${h.done ? 'done' : ''}">${highlight(h.text, q)}</span>`;
    li.onclick = () => h.card ? openCard(h.card) : select(h.k);
    li.style.cursor = 'pointer';
    ul.appendChild(li);
  });
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function highlight(text, q) {
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

// Trello-style markdown (links, bold, strike, italics, :ok:) → safe HTML
function md(s) {
  let h = esc(s.replace(/‌/g, ''));
  h = h.replace(/\\([^\w\s&])/g, (m, c) => `&#${c.charCodeAt(0)};`);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)(?:\s+&quot;.*?&quot;)?\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/~~(.+?)~~/g, '<del>$1</del>');
  h = h.replace(/(^|[\s>])_(.+?)_(?=[\s<]|$)/gm, '$1<em>$2</em>');
  h = h.replace(/:ok:/g, '✅').replace(/^- /gm, '• ');
  return h.replace(/\n/g, '<br>');
}
const fmtTime = iso => { const d = new Date(iso); return `${keyOf(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

      <div class="title">${esc(c.title)}</div>

        c.desc ? '<span title="有描述">📝</span>' : '',

  d.addEventListener('dragstart', e => {
    dragCard = c.id;
    d.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', c.id);
  });
  d.addEventListener('dragend', () => { dragCard = null; d.classList.remove('dragging'); clearDrop(); });
  return d;
}

function dropIndex(box, y) {
  const cards = [...box.querySelectorAll('.kcard:not(.dragging)')];
  return cards.filter(el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2 < y; }).length;
}
function showDropLine(box, idx) {
  document.querySelectorAll('.drop-line').forEach(x => x.remove());
  const line = document.createElement('div');
  line.className = 'drop-line';
  const cards = [...box.querySelectorAll('.kcard:not(.dragging)')];
  box.insertBefore(line, cards[idx] || null);
}
function clearDrop() {
  document.querySelectorAll('.drop-line').forEach(x => x.remove());
  document.querySelectorAll('.col.drop-target').forEach(x => x.classList.remove('drop-target'));
}

// position between neighbours, Trello-style, so only the moved card changes
function posAt(listId, idx, exceptId) {
  const sib = cardsOf(listId).filter(c => c.id !== exceptId);
  const prev = sib[idx - 1], next = sib[idx];
  if (prev && next) return (prev.pos + next.pos) / 2;
  if (prev) return prev.pos + 65536;
  if (next) return next.pos / 2;
  return 65536;
}
function moveCard(id, listId, idx) {
  const c = state.board.cards[id]; if (!c) return;
  c.pos = posAt(listId, idx, id);
  c.listId = listId;
  save(); renderBoard();
  if (openId === id) renderModal(true);
}
function addCard(listId, title) {
  const id = uid();
  state.board.cards[id] = {
    id, listId, pos: posAt(listId, cardsOf(listId).length), title, desc: '',
    labelIds: [], cover: null, checklists: [], comments: [], archived: false,
  };
  save(); renderBoard();
}
function addCardForm(btn, listId) {
  const form = document.createElement('div');
  form.className = 'new-card';
  form.innerHTML = `<textarea rows="2" placeholder="輸入卡片標題，按 Enter 新增"></textarea>
    <div style="display:flex;gap:6px"><button class="btn primary">新增</button><button class="btn" data-x>取消</button></div>`;
  btn.replaceWith(form);
  const ta = form.querySelector('textarea');
  ta.focus();
  const submit = () => {
    const v = ta.value.trim();
    if (!v) return;
    addCard(listId, v);
    // keep the form open in the re-rendered column for the next card
    const again = [...document.querySelectorAll('.col')][sortedLists().findIndex(l => l.id === listId)];
    if (again) addCardForm(again.querySelector('.add-card'), listId);
  };
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    if (e.key === 'Escape') renderBoard();
  };
  form.querySelector('.primary').onclick = submit;
  form.querySelector('[data-x]').onclick = () => renderBoard();
}
function addListForm(btn) {
  const form = document.createElement('div');
  form.className = 'col new-col';
  form.innerHTML = `<input placeholder="欄位名稱，按 Enter 新增">`;
  btn.replaceWith(form);
  const input = form.querySelector('input');
  input.focus();
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing && input.value.trim()) {
      const last = sortedLists().at(-1);
      state.board.lists.push({ id: uid(), name: input.value.trim(), pos: last ? last.pos + 65536 : 65536 });
      save(); renderBoard();
    }
    if (e.key === 'Escape') renderBoard();
  };
  input.onblur = () => setTimeout(renderBoard, 150);
}
function shiftList(l, dir) {
  const lists = sortedLists(), i = lists.indexOf(l), other = lists[i + dir];
  if (!other) return;
  [l.pos, other.pos] = [other.pos, l.pos];
  save(); renderBoard();
}
function deleteList(l) {
  const n = Object.values(state.board.cards).filter(c => c.listId === l.id).length;
  if (n) { alert(`「${l.name}」裡還有 ${n} 張卡片（含封存），請先移走再刪除欄位。`); return; }
  if (!confirm(`刪除欄位「${l.name}」？`)) return;
  state.board.lists = state.board.lists.filter(x => x !== l);
  save(); renderBoard();
}

// ---------- card detail ----------
function openCard(id) { openId = id; editingDesc = false; $('cardModal').hidden = false; renderModal(true); }
function closeCard() { openId = null; $('cardModal').hidden = true; }

function renderModal(force) {
  const c = openId && state.board.cards[openId];
  if (!c) { closeCard(); return; }
  const box = $('mbox');
  // don't wipe something the user is typing when a sync refresh comes in
  if (!force && box.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const draft = $('newComment') ? $('newComment').value : '';
  box.innerHTML = `
    ${c.cover ? `<div class="cover" style="background:${colorOf(c.cover)}"></div>` : ''}
    <button class="icon-btn m-close" data-a="close" title="關閉 (Esc)">✕</button>
    <div class="mbody">
      <div>
        <input class="m-title" data-a="title" value="${esc(c.title)}">
        <div class="m-row">在欄位
          <select data-a="list">${sortedLists().map(l => `<option value="${l.id}" ${l.id === c.listId ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>
          ${c.archived ? '<span class="arch-tag">已封存</span>' : ''}
        </div>
      </div>
      <div class="m-sec"><h4>🏷 標籤</h4><div class="lbl-pick">${state.board.labels.map(l =>
        `<button class="lbl ${c.labelIds.includes(l.id) ? '' : 'off'}" data-a="label" data-id="${l.id}" style="background:${colorOf(l.color)}">${esc(l.name)}</button>`).join('')}</div></div>
      <div class="m-sec"><h4>🎨 封面顏色</h4><div class="cover-pick">${['', ...Object.keys(TRELLO_COLORS)].map(k =>
        `<button class="sw ${(c.cover || '') === k ? 'on' : ''}" data-a="cover" data-c="${k}" title="${k || '無'}" style="background:${k ? TRELLO_COLORS[k] : 'var(--panel-2)'}">${k ? '' : '✕'}</button>`).join('')}</div></div>
      <div class="m-sec"><h4>📝 描述 ${editingDesc ? '' : '<button class="link-btn" data-a="editdesc">編輯</button>'}</h4>
        ${editingDesc
          ? `<textarea class="m-ta" id="descInput">${esc(c.desc)}</textarea>
             <div class="m-row"><button class="btn primary" data-a="savedesc">儲存</button><button class="btn" data-a="canceldesc">取消</button></div>`
          : `<div class="desc-view" data-a="editdesc">${c.desc ? md(c.desc) : '<span class="placeholder">點此新增描述或紀錄…</span>'}</div>`}
      </div>
      ${c.checklists.map(k => {
        const d = k.items.filter(i => i.done).length;
        return `<div class="m-sec"><h4>☑ ${esc(k.name)} <span class="muted">${d}/${k.items.length}</span>
            <button class="link-btn" data-a="delchk" data-k="${k.id}">刪除清單</button></h4>
          <div class="chk-bar"><i style="width:${k.items.length ? d / k.items.length * 100 : 0}%"></i></div>
          ${k.items.map(i => `<div class="chk-item ${i.done ? 'done' : ''}">
            <input type="checkbox" data-a="chkitem" data-k="${k.id}" data-id="${i.id}" ${i.done ? 'checked' : ''}>
            <span>${esc(i.text)}</span>
            <button class="icon-btn" data-a="delitem" data-k="${k.id}" data-id="${i.id}" title="刪除">✕</button></div>`).join('')}
          <form class="m-add" data-k="${k.id}"><input placeholder="新增項目"><button class="btn">新增</button></form>
        </div>`;
      }).join('')}
      <div><button class="btn" data-a="addchk">☑ 新增檢查清單</button></div>
      <div class="m-sec"><h4>💬 留言與紀錄</h4>
        <div class="m-add"><textarea class="m-ta small" id="newComment" placeholder="新增一則紀錄…">${esc(draft)}</textarea>
          <button class="btn primary" data-a="addcomment">送出</button></div>
        <div class="comments">${[...c.comments].sort((a, b) => b.date.localeCompare(a.date)).map(m => `
          <div class="comment"><div class="when"><span>${fmtTime(m.date)}</span>
            <button class="link-btn" data-a="delcomment" data-id="${m.id}">刪除</button></div>
            <div>${md(m.text)}</div></div>`).join('')}</div>
      </div>
      <div class="m-row m-foot">
        <button class="btn" data-a="archive">${c.archived ? '還原卡片' : '封存卡片'}</button>
        <button class="btn danger" data-a="delete">刪除卡片</button>
      </div>
    </div>`;
  if (editingDesc) $('descInput').focus();
}

function cardChanged() { save(); renderBoard(); renderModal(true); }
$('cardModal').addEventListener('click', e => {
  if (e.target.id === 'cardModal') { closeCard(); return; }
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-a]');
  const c = openId && state.board.cards[openId];
  if (!el || !c) return;
  const a = el.dataset.a, chk = id => c.checklists.find(k => k.id === id);
  if (a === 'close') closeCard();
  else if (a === 'label') {
    const id = el.dataset.id;
    c.labelIds = c.labelIds.includes(id) ? c.labelIds.filter(x => x !== id) : [...c.labelIds, id];
    cardChanged();
  }
  else if (a === 'cover') { c.cover = el.dataset.c || null; cardChanged(); }
  else if (a === 'editdesc') { editingDesc = true; renderModal(true); }
  else if (a === 'canceldesc') { editingDesc = false; renderModal(true); }
  else if (a === 'savedesc') { c.desc = $('descInput').value; editingDesc = false; cardChanged(); }
  else if (a === 'chkitem') { const i = chk(el.dataset.k).items.find(x => x.id === el.dataset.id); i.done = el.checked; cardChanged(); }
  else if (a === 'delitem') { const k = chk(el.dataset.k); k.items = k.items.filter(x => x.id !== el.dataset.id); cardChanged(); }
  else if (a === 'delchk') { if (confirm('刪除這個檢查清單？')) { c.checklists = c.checklists.filter(k => k.id !== el.dataset.k); cardChanged(); } }
  else if (a === 'addchk') { c.checklists.push({ id: uid(), name: '待辦清單', items: [] }); cardChanged(); }
  else if (a === 'addcomment') {
    const v = $('newComment').value.trim();
    if (!v) return;
    c.comments.push({ id: uid(), date: new Date().toISOString(), text: v });
    $('newComment').value = '';
    cardChanged();
  }
  else if (a === 'delcomment') { if (confirm('刪除這則紀錄？')) { c.comments = c.comments.filter(m => m.id !== el.dataset.id); cardChanged(); } }
  else if (a === 'archive') { c.archived = !c.archived; cardChanged(); }
  else if (a === 'delete') {
    if (!confirm(`刪除卡片「${c.title}」？`)) return;
    delete state.board.cards[c.id];
    closeCard(); save(); renderBoard();
    showToast('已刪除卡片', () => { state.board.cards[c.id] = c; save(); renderBoard(); });
  }
});
$('cardModal').addEventListener('change', e => {
  const c = openId && state.board.cards[openId];
  if (!c) return;
  if (e.target.dataset.a === 'title') { const v = e.target.value.trim(); if (v) { c.title = v; save(); renderBoard(); } }
  if (e.target.dataset.a === 'list') moveCard(c.id, e.target.value, cardsOf(e.target.value).length);
});
$('cardModal').addEventListener('keydown', e => {
  if (e.target.dataset.a === 'title' && e.key === 'Enter' && !e.isComposing) e.target.blur();
});
$('cardModal').addEventListener('submit', e => {
  e.preventDefault();
  const c = openId && state.board.cards[openId];
  const input = e.target.querySelector('input'), v = input.value.trim();
  if (!c || !v) return;
  c.checklists.find(k => k.id === e.target.dataset.k).items.push({ id: uid(), text: v, done: false });
  cardChanged();
  const again = $('mbox').querySelector(`form[data-k="${e.target.dataset.k}"] input`);
  if (again) again.focus();
});
$('showArchived').onchange = e => { showArchived = e.target.checked; renderBoard(); };

// ---------- cloud sync ----------
// One row per day in Supabase. `snap` remembers what each day looked like at the
// last successful sync, so we can tell local edits from remote ones (3-way merge per day).
const TABLE = 'worklog_days';

// Everything that syncs, as rows: each day ('YYYY-MM-DD'), the board's lists/labels
// ('board:meta') and each card on its own ('card:<id>') so edits on two devices rarely collide.
function rowsOf() {
  const m = { ...state.days };
  const b = state.board;
  if (b.lists.length || b.labels.length) m['board:meta'] = { lists: b.lists, labels: b.labels };
  for (const id in b.cards) m['card:' + id] = b.cards[id];
  return m;
}
function setRow(k, v) {
  const b = state.board;
  if (k === 'board:meta') { b.lists = v ? v.lists : []; b.labels = v ? v.labels : []; }
  else if (k.startsWith('card:')) { const id = k.slice(5); if (v) b.cards[id] = v; else delete b.cards[id]; }
  else if (v) state.days[k] = v;
  else delete state.days[k];
}
const cloud = { db: null, user: null, snap: {}, timer: null, chain: Promise.resolve() };
const snapKey = () => `${KEY}.synced.${cloud.user.id}`;
function saveSnap() { try { localStorage.setItem(snapKey(), JSON.stringify(cloud.snap)); } catch (e) {} }

function setSync(s) {
  const b = $('syncBtn');
  b.hidden = false;
  b.dataset.s = s;
  b.textContent = { ok: '已同步', syncing: '同步中…', error: '同步失敗，稍後重試', login: '未登入 · 只存在本機', offline: '離線中 · 連線後自動同步' }[s];
  b.title = cloud.user ? `已登入：${cloud.user.email}` : '點此登入以同步到其他裝置';
}

async function pull() {
  const { data, error } = await cloud.db.from(TABLE).select('day,data');
  if (error) throw error;
  const remote = {};
  data.forEach(r => { remote[r.day] = JSON.stringify(r.data); });
  const rows = rowsOf();
  for (const k of new Set([...Object.keys(remote), ...Object.keys(rows)])) {
    const mine = rows[k] ? JSON.stringify(rows[k]) : undefined;
    if (mine !== cloud.snap[k]) continue;   // edited here since last sync: keep, push() sends it
    setRow(k, remote[k] ? JSON.parse(remote[k]) : undefined);
  }
  cloud.snap = remote;
  saveSnap();
  writeLocal();
  render();
}

async function push() {
  const up = [], del = [], rows = rowsOf();
  for (const k in rows) {
    if (JSON.stringify(rows[k]) !== cloud.snap[k])
      up.push({ user_id: cloud.user.id, day: k, data: rows[k], updated_at: new Date().toISOString() });
  }
  for (const k in cloud.snap) if (!rows[k]) del.push(k);
  if (up.length) {
    const { error } = await cloud.db.from(TABLE).upsert(up);
    if (error) throw error;
    up.forEach(r => { cloud.snap[r.day] = JSON.stringify(r.data); });
  }
  if (del.length) {
    const { error } = await cloud.db.from(TABLE).delete().eq('user_id', cloud.user.id).in('day', del);
    if (error) throw error;
    del.forEach(k => { delete cloud.snap[k]; });
  }
  saveSnap();
}

function syncNow(withPull) {
  cloud.chain = cloud.chain.then(async () => {
    if (!cloud.user) return;
    if (!navigator.onLine) { setSync('offline'); return; }   // edits stay local; synced on 'online'
    setSync('syncing');
    try {
      if (withPull) await pull();
      await push();
      setSync('ok');
    } catch (e) {
      console.error('sync failed', e);
      setSync(navigator.onLine ? 'error' : 'offline');
    }
  });
  return cloud.chain;
}
function scheduleSync() {
  if (!cloud.user) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(() => syncNow(false), 800);
}

let signingUp = false;
function showAuth() {
  $('authErr').textContent = '';
  $('auth').hidden = false;
  $('authEmail').focus();
}
function setAuthMode(up) {
  signingUp = up;
  $('authSubmit').textContent = up ? '建立帳號' : '登入';
  $('authMode').textContent = up ? '已經有帳號？登入' : '第一次使用？建立帳號';
  $('authPass').autocomplete = up ? 'new-password' : 'current-password';
}
async function onSignedIn(user) {
  cloud.user = user;
  try { cloud.snap = JSON.parse(localStorage.getItem(snapKey())) || {}; } catch (e) { cloud.snap = {}; }
  $('auth').hidden = true;
  $('menuAuth').textContent = `登出（${user.email}）`;
  await syncNow(true);
}
function onSignedOut() {
  cloud.user = null;
  cloud.snap = {};
  $('menuAuth').textContent = '登入同步';
  setSync('login');
}

async function initCloud() {
  if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return;
  cloud.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  $('menuAuth').hidden = false;
  cloud.db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') onSignedOut();
  });
  const { data: { session } } = await cloud.db.auth.getSession();
  if (session) onSignedIn(session.user);
  else { onSignedOut(); showAuth(); }
}

$('authMode').onclick = () => { setAuthMode(!signingUp); $('authErr').textContent = ''; };
$('authSkip').onclick = () => { $('auth').hidden = true; };
$('syncBtn').onclick = () => { if (!cloud.user) showAuth(); else syncNow(true); };
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const err = $('authErr');
  err.className = 'auth-err';
  err.textContent = '';
  const email = $('authEmail').value.trim(), password = $('authPass').value;
  $('authSubmit').disabled = true;
  try {
    if (signingUp) {
      const { data, error } = await cloud.db.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session) await onSignedIn(data.user);
      else { err.className = 'auth-err info'; err.textContent = '帳號已建立，請到信箱點確認連結後再回來登入。'; setAuthMode(false); }
    } else {
      const { data, error } = await cloud.db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      $('authPass').value = '';
      await onSignedIn(data.user);
    }
  } catch (ex) {
    err.textContent = /Invalid login/i.test(ex.message) ? 'Email 或密碼不正確' :
      /not confirmed/i.test(ex.message) ? '這個帳號還沒完成 Email 確認，請先到信箱點確認連結' : ex.message;
  } finally {
    $('authSubmit').disabled = false;
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && cloud.user) syncNow(true); });
window.addEventListener('online', () => { if (cloud.user) syncNow(true); });
window.addEventListener('offline', () => { if (cloud.user) setSync('offline'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- christmas ----------
try { if (localStorage.getItem(KEY + '.xmas') === 'off') document.body.classList.add('no-xmas'); } catch (e) {}
(function makeSnow() {
  const box = $('snow');
  for (let i = 0; i < 40; i++) {
    const f = document.createElement('span');
    const size = 3 + Math.random() * 6;
    const dur = 9 + Math.random() * 10;
    f.className = 'flake';
    f.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;opacity:${.35 + Math.random() * .5};` +
      `animation-duration:${dur}s;animation-delay:${-Math.random() * dur}s;--drift:${(Math.random() - .5) * 120}px`;
    box.appendChild(f);
  }
})();
function renderCountdown() {
  const now = new Date(), y = now.getFullYear();
  const today = new Date(y, now.getMonth(), now.getDate());
  let xmas = new Date(y, 11, 25);
  if (today > xmas) xmas = new Date(y + 1, 11, 25);
  const days = Math.round((xmas - today) / 86400000);
  $('xmasCountdown').textContent = days === 0 ? '聖誕快樂！🎄' : `聖誕節倒數 ${days} 天`;
}
renderCountdown();

// refresh "today" when the page stays open past midnight
let lastToday = todayKey();
setInterval(() => { if (todayKey() !== lastToday) { lastToday = todayKey(); render(); renderCountdown(); } }, 60000);

render();
initCloud();
</script>
